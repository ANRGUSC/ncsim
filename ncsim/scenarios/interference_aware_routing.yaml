scenario:
  name: "Interference-Aware Routing Test"

  # X-topology with two corridors:
  #
  # n0(0,0) ---- n1(50,0) ---- n2(100,0)      top corridor
  #   \                           /
  #    n3(50,50)  (center hub)
  #   /                           \
  # n4(0,100) --- n5(50,100) --- n6(100,100)   bottom corridor
  #
  # Two flows: n0->n6 and n4->n2 (crossing diagonally)
  # Each has two path options: via center (n3) or via top/bottom corridor
  # Both via center: links through n3 all interfere (midpoints within radius)
  # Spread across corridors: top (y~0) and bottom (y~100) are >60 apart -> no interference

  network:
    nodes:
      - {id: n0, compute_capacity: 1000, position: {x: 0, y: 0}}
      - {id: n1, compute_capacity: 1000, position: {x: 50, y: 0}}
      - {id: n2, compute_capacity: 1000, position: {x: 100, y: 0}}
      - {id: n3, compute_capacity: 1000, position: {x: 50, y: 50}}
      - {id: n4, compute_capacity: 1000, position: {x: 0, y: 100}}
      - {id: n5, compute_capacity: 1000, position: {x: 50, y: 100}}
      - {id: n6, compute_capacity: 1000, position: {x: 100, y: 100}}
    links:
      # Top corridor
      - {id: l_n0_n1, from: n0, to: n1, bandwidth: 100, latency: 0.001}
      - {id: l_n1_n2, from: n1, to: n2, bandwidth: 100, latency: 0.001}
      # Bottom corridor
      - {id: l_n4_n5, from: n4, to: n5, bandwidth: 100, latency: 0.001}
      - {id: l_n5_n6, from: n5, to: n6, bandwidth: 100, latency: 0.001}
      # Center hub connections
      - {id: l_n0_n3, from: n0, to: n3, bandwidth: 100, latency: 0.001}
      - {id: l_n3_n6, from: n3, to: n6, bandwidth: 100, latency: 0.001}
      - {id: l_n4_n3, from: n4, to: n3, bandwidth: 100, latency: 0.001}
      - {id: l_n3_n2, from: n3, to: n2, bandwidth: 100, latency: 0.001}

  dags:
    - id: dag_1
      inject_at: 0.0
      tasks:
        # Flow 1: n0 -> n6
        - {id: T_src1, compute_cost: 1, pinned_to: n0}
        - {id: T_dst1, compute_cost: 1, pinned_to: n6}
        # Flow 2: n4 -> n2
        - {id: T_src2, compute_cost: 1, pinned_to: n4}
        - {id: T_dst2, compute_cost: 1, pinned_to: n2}
      edges:
        - {from: T_src1, to: T_dst1, data_size: 100}
        - {from: T_src2, to: T_dst2, data_size: 100}

  config:
    scheduler: manual
    seed: 42
    routing: interference_aware
    interference: proximity
    interference_radius: 60

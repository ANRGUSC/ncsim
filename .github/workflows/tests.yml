name: Tests and Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            viz/server/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r viz/server/requirements.txt

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Install and run the wheel
        run: |
          python -m venv /tmp/ncsim-wheel-smoke
          /tmp/ncsim-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/ncsim-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ncsim-wheel-smoke/bin/ncsim --version
          /tmp/ncsim-wheel-smoke/bin/ncsim \
            --scenario "$GITHUB_WORKSPACE/scenarios/demo_simple.yaml" \
            --output /tmp/ncsim-wheel-results
          test -s /tmp/ncsim-wheel-results/scenario.yaml
          test -s /tmp/ncsim-wheel-results/trace.jsonl
          test -s /tmp/ncsim-wheel-results/metrics.json

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ncsim-distributions
          path: dist/*
          if-no-files-found: error

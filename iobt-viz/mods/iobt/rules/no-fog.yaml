# IoBT No Fog of War Rules
# This file disables fog of war and shroud visibility effects

# Replace fog palette with transparent version
World:
	-ShroudPalette@fog:
	PaletteFromRGBA@fog:
		Name: fog
		R: 0
		G: 0
		B: 0
		A: 0
	-ShroudPalette@shroud:
	PaletteFromRGBA@shroud:
		Name: shroud
		R: 0
		G: 0
		B: 0
		A: 0

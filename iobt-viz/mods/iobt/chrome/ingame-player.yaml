# Simplified ingame player chrome for IoBT visualization
# Removed: production sidebar, command bar, stance bar, support powers
# Kept: IoBT branding, control groups, mute indicator, radar minimap, options button

Container@PLAYER_WIDGETS:
	Logic: LoadIngameChatLogic
	Children:
		# Required by LoadIngamePlayerOrObserverUILogic for win/loss state handling
		LogicTicker@SIDEBAR_TICKER:

		# IoBT branding in bottom-right corner
		Container@IOBT_BRANDING:
			X: WINDOW_WIDTH - 160
			Y: WINDOW_HEIGHT - 50
			Width: 150
			Height: 45
			Children:
				Label@IOBT_TITLE:
					Width: PARENT_WIDTH
					Height: 20
					Font: MediumBold
					Align: Right
					Text: IoBT-viz
					Contrast: true
				Label@IOBT_ATTRIBUTION:
					Y: 22
					Width: PARENT_WIDTH
					Height: 15
					Font: Small
					Align: Right
					Text: ANRG, USC, 2026
					Contrast: true

		# Chat container for debugging/logging
		Container@CHAT_ROOT:

		# Control groups for unit selection (Ctrl+1, etc.)
		ControlGroups@CONTROLGROUPS:
			SelectGroupKeyPrefix: ControlGroupSelect
			CreateGroupKeyPrefix: ControlGroupCreate
			AddToGroupKeyPrefix: ControlGroupAddTo
			CombineWithGroupKeyPrefix: ControlGroupCombineWith
			JumpToGroupKeyPrefix: ControlGroupJumpTo

		# IoBT-specific hotkey handler (network overlay toggle)
		LogicKeyListener@IOBT_KEYHANDLER:
			Logic: IoBTNetworkOverlayHotkeyLogic

		# Mute indicator
		Container@MUTE_INDICATOR:
			Logic: MuteIndicatorLogic
			X: WINDOW_WIDTH - WIDTH - 260
			Y: 10
			Width: 200
			Height: 25
			Children:
				Image@ICON:
					X: PARENT_WIDTH - WIDTH
					Y: 1
					Width: 24
					Height: 24
					ImageCollection: sidebar-bits
					ImageName: indicator-muted
				Label@LABEL:
					Width: PARENT_WIDTH - 30
					Height: 25
					Align: Right
					Text: label-mute-indicator
					Contrast: true

		# Sidebar top with options button and radar minimap
		Image@SIDEBAR_BACKGROUND_TOP:
			Logic: AddFactionSuffixLogic
			X: WINDOW_WIDTH - 250
			Y: 10
			Width: 238
			Height: 262
			ImageCollection: sidebar
			ImageName: background-top
			ClickThrough: false
			Children:
				Container@TOP_BUTTONS:
					Logic: MenuButtonsChromeLogic
					X: 9
					Y: 7
					Children:
						MenuButton@OPTIONS_BUTTON:
							Logic: AddFactionSuffixLogic
							X: 192
							Width: 28
							Height: 28
							Background: sidebar-button
							Key: escape
							TooltipText: button-top-buttons-options-tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							DisableWorldSounds: true
							VisualHeight: 0
							Children:
								Image@ICON:
									X: 6
									Y: 6
									ImageCollection: order-icons
									ImageName: options
				Image@RADAR:
					Logic: AddFactionSuffixLogic, IngameRadarDisplayLogic
					X: 8
					Y: 40
					ImageCollection: sidebar
					ImageName: radar
					Children:
						LogicTicker@RADAR_TICKER:
						ColorBlock@RADAR_FADETOBLACK:
							Width: 222
							Height: 222
						Radar@RADAR_MINIMAP:
							WorldInteractionController: INTERACTION_CONTROLLER
							X: 1
							Y: 1
							Width: 220
							Height: 220
							SoundUp: RadarUp
							SoundDown: RadarDown
							Children:
						VideoPlayer@PLAYER:
							X: 1
							Y: 1
							Width: 220
							Height: 220
							Skippable: false

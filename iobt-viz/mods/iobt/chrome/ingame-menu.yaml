Container@INGAME_MENU:
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Logic: IoBTIngameMenuLogic
		Buttons: RESUME, SETTINGS, QUIT
		ButtonStride: 0, 40
	Children:
		Background@BORDER:
			X: 0 - 15
			Y: 0 - 15
			Width: WINDOW_WIDTH + 30
			Height: WINDOW_HEIGHT + 30
			Background: mainmenu-border
		Label@TITLE:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: 80
			Width: 300
			Height: 40
			Text: IoBT Visualization
			Align: Center
			Font: Bold
			Contrast: True
		Container@PANEL_ROOT:
		Background@MENU_BUTTONS:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: (WINDOW_HEIGHT - HEIGHT) / 2
			Width: 200
			Height: 160
			Children:
				Label@LABEL_TITLE:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 20
					Width: 200
					Height: 30
					Text: Menu
					Align: Center
					Font: Bold
				Button@BUTTON_TEMPLATE:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 60
					Width: 140
					Height: 30
					Font: Bold

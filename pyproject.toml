[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anrg-ncsim"
version = "1.1.0"
description = "Headless Discrete Event Simulator for Networked Computing Research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Bhaskar Krishnamachari", email = "bkrishna@usc.edu"}
]
keywords = ["simulation", "discrete-event", "network", "dag", "scheduling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "anrg-saga>=2.0.4",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://anrgusc.github.io/ncsim/"
Repository = "https://github.com/ANRGUSC/ncsim"
Issues = "https://github.com/ANRGUSC/ncsim/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ncsim = "ncsim.main:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "viz*", "scenarios*", "docs*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"
